name: Build Payment Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  php:
    name: PHP API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Check PHP
        run: php -l api/index.php


  cpp:
    name: C++ Payment Core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile C++
        run: |
          cd payment-core
          g++ -std=c++20 -O2 -Wall -Wextra main.cpp -o payment-core

      - name: Run core
        run: |
          cd payment-core
          ./payment-core


  python:
    name: Python Fraud Engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r fraud/requirements.txt

      - name: Compile Python
        run: |
          python -m compileall fraud


  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - php
      - cpp
      - python

    steps:
      - uses: actions/checkout@v4

      - name: Build API
        run: docker build ./api -t payment-api

      - name: Build C++
        run: docker build ./payment-core -t payment-core

      - name: Build Fraud
        run: docker build ./fraud -t payment-fraud
